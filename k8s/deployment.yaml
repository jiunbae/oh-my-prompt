apiVersion: apps/v1
kind: Deployment
metadata:
  name: oh-my-prompt
  namespace: oh-my-prompt
  labels:
    app: oh-my-prompt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oh-my-prompt
  template:
    metadata:
      labels:
        app: oh-my-prompt
    spec:
      imagePullSecrets:
        - name: registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: oh-my-prompt
          image: registry.jiun.dev/oh-my-prompt:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          volumeMounts:
            # readOnlyRootFilesystem is true, but Next standalone writes runtime
            # cache and temp files. Provide writable emptyDir mounts so caching
            # doesn't fail with EROFS.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          envFrom:
            - configMapRef:
                name: oh-my-prompt-config
            - secretRef:
                name: oh-my-prompt-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
