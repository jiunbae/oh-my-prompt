apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-db
  namespace: oh-my-prompt
  labels:
    app: prompt-db
spec:
  replicas: 1
  strategy:
    # RWO PVC can only be mounted by one pod at a time, so a rolling update
    # would deadlock (new pod pending on the volume held by the old pod).
    type: Recreate
  selector:
    matchLabels:
      app: prompt-db
  template:
    metadata:
      labels:
        app: prompt-db
    spec:
      containers:
        - name: postgres
          # Must match docker-compose (pgvector/pgvector:pg16): migration 0016
          # runs `CREATE EXTENSION vector`, unavailable in plain postgres:16-alpine.
          # Keep the image's root entrypoint: when upgrading an existing Alpine
          # PostgreSQL volume (uid 70) to Debian (uid 999), the official
          # entrypoint fixes ownership before dropping to the postgres user.
          image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "prompt"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oh-my-prompt-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "prompts"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prompt
                - -d
                - prompts
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prompt
                - -d
                - prompts
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: prompt-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prompt-db-pvc
  namespace: oh-my-prompt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
