apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-db
  namespace: oh-my-prompt
  labels:
    app: prompt-db
spec:
  replicas: 1
  strategy:
    # RWO PVC can only be mounted by one pod at a time, so a rolling update
    # would deadlock (new pod pending on the volume held by the old pod).
    type: Recreate
  selector:
    matchLabels:
      app: prompt-db
  template:
    metadata:
      labels:
        app: prompt-db
    spec:
      containers:
        - name: postgres
          # Built from docker/postgres-pgvector. It preserves the Alpine
          # postgres uid 70 and PostgreSQL 16.14 data format used by existing
          # volumes while adding pgvector 0.8.1.
          image: registry.jiun.dev/oh-my-prompt-postgres@sha256:61e6b6b172c86d52f0a9ad4339120750015bf226cb11408d3555abd29c1fc324
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "prompt"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oh-my-prompt-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "prompts"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prompt
                - -d
                - prompts
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prompt
                - -d
                - prompts
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: prompt-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prompt-db-pvc
  namespace: oh-my-prompt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
