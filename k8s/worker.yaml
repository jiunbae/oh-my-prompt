apiVersion: apps/v1
kind: Deployment
metadata:
  name: oh-my-prompt-worker
  namespace: oh-my-prompt
  labels:
    app: oh-my-prompt-worker
spec:
  # Keep at 1 replica: BullMQ dedupes jobs, but a single consumer keeps
  # concurrency predictable. Scale up only if job throughput demands it.
  replicas: 1
  selector:
    matchLabels:
      app: oh-my-prompt-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: oh-my-prompt-worker
    spec:
      imagePullSecrets:
        - name: registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: registry.jiun.dev/oh-my-prompt:latest
          imagePullPolicy: Always
          # Same image as the web Deployment; run the worker bundle instead of
          # the Next server. Self-schedules via BullMQ repeatables.
          command: ["node", "dist/worker.cjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: oh-my-prompt-config
            - secretRef:
                name: oh-my-prompt-secrets
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # No HTTP surface — liveness checks the heartbeat file the worker
          # touches every 15s.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/omp-worker-heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/omp-worker-heartbeat) )) -lt 60
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
