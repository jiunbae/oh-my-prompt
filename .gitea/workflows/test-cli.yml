name: Test CLI

# GitHub Actions is retired for this repo. Gitea (jiunbae/oh-my-prompt) mirrors
# GitHub on every push via webhook and runs CI on the jiun-mini runner, where
# `ubuntu-latest` maps to catthehacker/ubuntu:act-latest.
#
# Mirrors are read-only, so `workflow_dispatch` is the only way to re-run.

on:
  push:
    branches: [main]
    paths:
      - 'src/omp/**'
      - 'packages/omp-cli/**'
      - 'scripts/build-cli.sh'
      - '.gitea/workflows/test-cli.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: |
          chmod +x scripts/build-cli.sh
          ./scripts/build-cli.sh

      - name: Verify build
        run: node packages/omp-cli/scripts/verify-build.js

      - name: Test CLI commands
        run: |
          cd packages/omp-cli
          npm link
          omp --help
          omp config get

      - name: Test packed CLI in a clean directory
        run: |
          cd packages/omp-cli
          pack_dir="$(mktemp -d)"
          tarball="$(npm pack --silent)"
          npm install --prefix "$pack_dir" "./$tarball"
          "$pack_dir/node_modules/.bin/omp" --help
          status_json="$(XDG_CONFIG_HOME="$pack_dir/xdg-native" "$pack_dir/node_modules/.bin/omp" status --json)"
          STATUS_JSON="$status_json" node -e "
            const status = JSON.parse(process.env.STATUS_JSON);
            if (status.sqliteDriver.name !== 'better-sqlite3' || status.sqliteDriver.fallback) {
              throw new Error('expected the native SQLite driver on the supported Linux runner');
            }
          "

          fallback_dir="$(mktemp -d)"
          npm install --omit=optional --prefix "$fallback_dir" "./$tarball"
          fallback_json="$(XDG_CONFIG_HOME="$fallback_dir/xdg-fallback" "$fallback_dir/node_modules/.bin/omp" status --json)"
          STATUS_JSON="$fallback_json" node -e "
            const status = JSON.parse(process.env.STATUS_JSON);
            if (status.sqliteDriver.name !== 'sql.js' || !status.sqliteDriver.fallback) {
              throw new Error('expected sql.js when optional dependencies are omitted');
            }
          "
          rm -f "$tarball"
