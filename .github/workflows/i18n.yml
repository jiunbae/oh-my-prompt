name: i18n Key Parity

on:
  push:
    branches: [main]
    paths:
      - 'messages/**'
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/i18n.yml'
  pull_request:
    branches: [main]
    paths:
      - 'messages/**'
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/i18n.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pure Node, zero dependencies — no install step needed.
      - name: Check locale key parity (en is the source of truth)
        run: node scripts/check-i18n.mjs
