name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check locale parity
        run: pnpm check-i18n

      - name: Check color contrast
        run: pnpm check-contrast

      - name: Audit dependencies
        run: corepack pnpm@11.13.0 --pm-on-fail=ignore audit

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Build worker bundle
        run: pnpm build:worker
